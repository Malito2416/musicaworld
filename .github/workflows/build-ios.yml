name: Build Unsigned iOS IPA for Sideloadly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          swift --version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Patch Swift Tools Version for Compatibility
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const glob = (dir) => {
              let results = [];
              try {
                for (const file of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, file.name);
                  if (file.isDirectory()) results = results.concat(glob(full));
                  else if (file.name === 'Package.swift') results.push(full);
                }
              } catch(e) {}
              return results;
            };
            for (const p of glob('node_modules')) {
              let content = fs.readFileSync(p, 'utf8');
              if (content.includes('swift-tools-version: 6.2')) {
                content = content.replace(/swift-tools-version:\s*6\.2/g, 'swift-tools-version: 6.0')
                                 .replace(/.*InferIsolatedConformances.*/g, '')
                                 .replace(/.*NonisolatedNonsendingByDefault.*/g, '');
                fs.writeFileSync(p, content);
                console.log('Patched for Swift 6.0 compatibility:', p);
              }
            }
          "

      - name: Generate Native iOS Files (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods Dependencies
        run: |
          gem install cocoapods
          cd ios
          pod install

      - name: Build iOS Application (.app)
        run: |
          cd ios
          if [ -d "MusicWorld.xcworkspace" ]; then
            BUILD_TARGET="-workspace MusicWorld.xcworkspace"
          else
            BUILD_TARGET="-project MusicWorld.xcodeproj"
          fi

          echo "Compilando con $BUILD_TARGET..."

          set -o pipefail
          xcodebuild $BUILD_TARGET \
            -scheme "MusicWorld" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            SYMROOT="$RUNNER_TEMP/products" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || {
              echo "=========================================="
              echo "         ERRORES DE COMPILACION           "
              echo "=========================================="
              grep -E -A 5 -B 2 "error:" xcodebuild.log || true
              echo "=========================================="
              echo "         ULTIMAS 60 LINEAS DEL LOG        "
              echo "=========================================="
              tail -n 60 xcodebuild.log
              exit 1
            }

      - name: Package into IPA for Sideloadly
        run: |
          APP_DIR=$(find "$RUNNER_TEMP/products" -name "MusicWorld.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find "$RUNNER_TEMP/products" -name "*.app" -type d | head -n 1)
          fi

          if [ -z "$APP_DIR" ]; then
            echo "Error: No se encontró la carpeta .app en $RUNNER_TEMP/products"
            ls -laR "$RUNNER_TEMP/products" || true
            exit 1
          fi

          echo "Empaquetando app encontrada en: $APP_DIR"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_DIR" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "MusicWorld-unsigned.ipa" Payload
          ls -lh "MusicWorld-unsigned.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicWorld-iOS-IPA
          path: ${{ runner.temp }}/MusicWorld-unsigned.ipa
          retention-days: 7
