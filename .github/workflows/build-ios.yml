name: Build Unsigned iOS IPA for Sideloadly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native iOS Files (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods Dependencies
        run: |
          gem install cocoapods
          cd ios
          pod install

      - name: Build Xcode Archive
        run: |
          cd ios
          if [ -d "MusicWorld.xcworkspace" ]; then
            BUILD_TARGET="-workspace MusicWorld.xcworkspace"
          else
            BUILD_TARGET="-project MusicWorld.xcodeproj"
          fi

          echo "Compilando con $BUILD_TARGET..."

          xcodebuild $BUILD_TARGET \
            -scheme "MusicWorld" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MusicWorld.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA for Sideloadly
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/MusicWorld.xcarchive/Products/Applications/MusicWorld.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "MusicWorld-unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicWorld-iOS-IPA
          path: ${{ runner.temp }}/MusicWorld-unsigned.ipa
          retention-days: 7
